name: Refresh accessibility data

# Weekly, plus a manual button in the Actions tab.
on:
  schedule:
    - cron: "0 9 * * 1"   # Mondays, 09:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install openpyxl

      - name: Collect issues
        env:
          # The built-in Actions token. No secret to create, and it only ever
          # sees public data, which is what belongs on a public dashboard.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 track_a11y.py \
            --owner "${{ github.repository_owner }}" \
            --global-limit 300 \
            --classify-cap 400 \
            --json docs/data.json \
            --out /tmp/accessibility-issues.xlsx

      - name: Commit if the data moved
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json
          # No commit when nothing changed, so the history stays meaningful.
          git diff --staged --quiet || git commit -m "Refresh accessibility data"
          git push
